<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Del Surco</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../image/soloLogo.png">
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body>

    <div class="register-wrapper">
        <a href="../index.html" class="btn-back-custom">← Volver</a>
        
        <!-- VISTA 1: Selección de Tipo de Usuario (Comprador / Vendedor) -->
        <section id="roleSelectionView" class="role-selection-section">
            <!-- Logo superior -->
            <div class="top-logo-container">
                <img src="../image/soloLogo.png" alt="Del Surco Logo">
            </div>

            <div class="role-header">
                <h1>Tu lugar en el campo</h1>
                <p>Elige tu perfil para comenzar a transformar la agronomía.</p>
            </div>

            <div class="role-cards-container">
                <!-- Tarjeta Vendedor -->
                <a href="registro-vendedor.html" class="role-card" id="cardVendedor">
                    <img src="../image/Vendedor.jpeg" alt="Entrar como Vendedor" class="role-bg-img">
                    <div class="role-card-overlay">
                        <img src="../icon/tienda.png" alt="Icono Vendedor" class="role-icon-img">
                        <span>Entrar como Vendedor</span>
                    </div>
                </a>

                <!-- Tarjeta Comprador -->
                <a href="registro-comprador.html" class="role-card" id="cardComprador">
                    <img src="../image/Comprador.jpeg" alt="Entrar como Comprador" class="role-bg-img">
                    <div class="role-card-overlay">
                        <img src="../icon/canasta.png" alt="Icono Comprador" class="role-icon-img">
                        <span>Entrar como Comprador</span>
                    </div>
                </a>
            </div>
        </section>

    </div>

</body>
</html>
